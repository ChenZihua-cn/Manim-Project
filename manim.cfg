; ============================================
; Manim Community 配置文件
; 官方文档: https://docs.manim.community/en/stable/guides/configuration.html
; ============================================

; ============================================
; 【命令行参数速查表】
; ============================================
;
; ---------- 质量参数 ----------
;   -l, --low_quality      低质量  480p15 (854x480, 15fps) - 快速预览
;   -m, --medium_quality   中质量  720p30 (1280x720, 30fps)
;   -e, --high_quality     高质量 1080p60 (1920x1080, 60fps)
;   -k, --four_k           4K     2160p60 (3840x2160, 60fps)
;
; ---------- 输出控制 ----------
;   -p, --preview          渲染完成后自动播放视频
;   -f, --show_in_file_browser  渲染完成后打开文件夹
;   -q, --quiet            静默模式，减少输出信息
;   --write_to_movie       强制写入视频文件（默认开启）
;   --format gif           输出 GIF 而不是 MP4
;   --transparent          透明背景（用于合成）
;
; ---------- 渲染范围 ----------
;   -n START,END          只渲染指定动画范围（如 -n 3,6 渲染第3到第6个动画）
;   -s, --save_last_frame  只保存最后一帧为图片
;   -g, --save_pngs        保存每一帧为 PNG 序列
;
; ---------- 路径配置 ----------
;   -o DIR, --media_dir DIR    指定输出目录
;   --config_file PATH         指定配置文件（覆盖默认）
;
; ---------- 常用组合 ----------
;   快速预览:   manim test.py SceneName -pl
;   最终渲染:   manim test.py SceneName -eh
;   GIF输出:    manim test.py SceneName --format gif -m
;   单帧截图:   manim test.py SceneName -s
; ============================================

[CLI]
; 媒体文件输出根目录
; 视频、图片、文本等会分别放在 media/videos/, media/images/, media/texts/
; 默认: ./media
media_dir = ./media

; 是否将场景名称作为子文件夹名
; 设为 true 时: media/videos/场景名/分辨率/xxx.mp4
; 设为 false 时: media/videos/分辨率/xxx.mp4
; 默认: true
scene_names = true

[render]
; 默认分辨率
; 可选: 4320p60, 2160p60, 1440p60, 1080p60, 1080p30, 720p30, 480p15
; 默认: 1080p60
quality = 1080p30

; 帧率（覆盖 quality 中的 fps）
; 默认: 60
frame_rate = 30

; 是否开启透明通道（用于后期合成）
; 默认: false
transparent = false

; 背景颜色
; 默认: BLACK
; 可选: WHITE, RED, GREEN, BLUE, YELLOW, GRAY, GREY 等
background_color = "#333333"

; 是否显示进度条
; 默认: true
progress_bar = true

; 是否显示帧编号（用于调试）
; 默认: false
show_animation_progress = false

[ffmpeg]
; FFmpeg 可执行文件路径（如果不在系统 PATH 中）
; ffmpeg_executable = ffmpeg

; 视频编码器
; 默认: libx264
; 可选: libx265 (HEVC, 更小体积但兼容性差), libvpx-vp9 (WebM)
pixel_format = yuv420p

[custom_folders]
; 各类型文件的子目录名称（相对于 media_dir 设置）
; 最终输出结构：
;   media_dir/
;   ├── video_dir/        -> 视频文件 (.mp4)
;   ├── images_dir/       -> 图片文件 (.png, .jpg)
;   ├── sections_dir/     -> 章节片段
;   └── partial_movie_dir/ -> 渲染过程中的临时片段

video_dir = videos
images_dir = images
sections_dir = sections
partial_movie_dir = partial_movie_files

; 注意：texts 目录由 Manim 自动生成，用于缓存 Text/Tex 渲染结果

[logger]
; 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
; 默认: INFO
log_level =
